name: Orchestrator CI

on:
  push:
    branches:
      - main
      - develop
      - "task/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestrator:
    name: Validate Orchestrator
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make orchestrator executable
        run: chmod +x orchestrator.sh

      - name: Validate shell script syntax
        run: bash -n orchestrator.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck orchestrator.sh

      - name: Verify help command
        run: ./orchestrator.sh help 

      - name: Launch application
        run: ./orchestrator.sh launch

      - name: Wait for backend
        run: |
          echo "Waiting for backend..."

          for i in {1..30}; do
            if curl --silent --fail http://localhost:8080/api/applications > /dev/null; then
              echo "Backend is ready."
              exit 0
            fi

            echo "Attempt $i/30..."
            sleep 5
          done

          echo "Backend failed to start."
          exit 1

      - name: Verify health command
        run: ./orchestrator.sh health

      - name: Verify backend API
        run: |
          curl --fail http://localhost:8080/api/applications

      - name: Verify frontend
        run: |
          curl --fail http://localhost:5173

      - name: Show Docker containers
        if: always()
        run: docker ps -a

      - name: Show backend logs
        if: failure()
        run: docker compose logs backend

      - name: Show frontend logs
        if: failure()
        run: docker compose logs frontend

      - name: Stop application
        if: always()
        run: ./orchestrator.sh stop

      - name: Clean workspace
        if: always()
        run: |
          printf "y\n" | ./orchestrator.sh clean

      - name: Verify cleanup
        if: always()
        run: |
          test -d workspace
          test -d data