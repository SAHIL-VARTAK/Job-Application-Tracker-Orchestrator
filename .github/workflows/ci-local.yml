name: Local Orchestrator CI

on:
  push:
    branches:
      - main
      - develop
      - "task/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestrator-local:
    name: Validate Local Orchestrator
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Make orchestrator executable
        run: chmod +x orchestrator-local.sh

      - name: Validate shell script syntax
        run: bash -n orchestrator-local.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck orchestrator-local.sh

      - name: Verify help command
        run: ./orchestrator-local.sh help

      - name: Launch application
        run: ./orchestrator-local.sh launch --detach

      - name: Wait for backend
        run: |
          echo "Waiting for backend..."

          for i in {1..60}; do
            if curl --silent --fail http://localhost:8080/api/applications >/dev/null; then
              echo "Backend is ready."
              exit 0
            fi

            echo "Attempt $i/60..."
            sleep 5
          done

          echo "Backend failed to start."
          exit 1

      - name: Wait for frontend
        run: |
          echo "Waiting for frontend..."

          for i in {1..60}; do
            if curl --silent --fail http://localhost:5173 >/dev/null; then
              echo "Frontend is ready."
              exit 0
            fi

            echo "Attempt $i/60..."
            sleep 5
          done

          echo "Frontend failed to start."
          exit 1

      - name: Verify backend API
        run: |
          curl --fail http://localhost:8080/api/applications

      - name: Verify Swagger UI
        run: |
          curl --fail http://localhost:8080/swagger-ui/index.html

      - name: Verify frontend
        run: |
          curl --fail http://localhost:5173

      - name: Show Java processes
        if: always()
        run: |
          ps -ef | grep java || true

      - name: Show Node processes
        if: always()
        run: |
          ps -ef | grep node || true

      - name: Stop application
        if: always()
        run: |
          ./orchestrator-local.sh stop

      - name: Verify cleanup
        if: always()
        run: |
          test -d workspace
          test -d workspace/Job-Application-Tracker
          test -d workspace/Job-Application-Tracker-UI
          test ! -f .orchestrator-local/backend.pid
          test ! -f .orchestrator-local/frontend.pid